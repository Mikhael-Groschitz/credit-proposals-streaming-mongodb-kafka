networks:
  credpipe-net:
    name: credpipe-net
    driver: bridge

volumes:
  mongo-data:
    name: credpipe-mongo-data
  kafka-data:
    name: credpipe-kafka-data
  minio-data:
    name: credpipe-minio-data

services:
  mongo:
    image: mongo:8.0.17
    hostname: mongo
    command: ["--replSet", "${MONGO_REPLICA_SET:-rs0}", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - credpipe-net
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  mongo-init:
    image: mongo:8.0.17
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_HOST: mongo
      MONGO_PORT: "27017"
      MONGO_REPLICA_SET: ${MONGO_REPLICA_SET:-rs0}
    volumes:
      - ./mongo/init-replica-set.sh:/init-replica-set.sh:ro
    entrypoint: ["bash", "/init-replica-set.sh"]
    networks:
      - credpipe-net
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/init-done"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s

  kafka:
    image: apache/kafka:4.3.1
    hostname: kafka
    ports:
      - "9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - credpipe-net
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:?defina KAFKA_CLUSTER_ID em infra/.env (rode scripts/generate-kafka-cluster-id.sh)}
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:19093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:19093
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  kafka-init:
    image: apache/kafka:4.3.1
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_INTERNO: kafka:19092
      KAFKA_TOPIC_PROPOSTAS: ${KAFKA_TOPIC_PROPOSTAS:-propostas.cdc}
      KAFKA_TOPIC_PARTITIONS: ${KAFKA_TOPIC_PARTITIONS:-6}
      KAFKA_TOPIC_REPLICATION_FACTOR: ${KAFKA_TOPIC_REPLICATION_FACTOR:-1}
    volumes:
      - ./kafka/create-topics.sh:/create-topics.sh:ro
    entrypoint: ["bash", "/create-topics.sh"]
    networks:
      - credpipe-net
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/init-done"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    hostname: minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?defina MINIO_ROOT_USER em infra/.env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?defina MINIO_ROOT_PASSWORD em infra/.env}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - credpipe-net
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z-cpuv1
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_HOST: minio
      MINIO_PORT: "9000"
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_BRONZE: ${MINIO_BUCKET_BRONZE:-bronze}
      MINIO_BUCKET_SILVER: ${MINIO_BUCKET_SILVER:-silver}
      MINIO_BUCKET_GOLD: ${MINIO_BUCKET_GOLD:-gold}
    volumes:
      - ./minio/create-buckets.sh:/create-buckets.sh:ro
    entrypoint: ["sh", "/create-buckets.sh"]
    networks:
      - credpipe-net
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/init-done"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s

  spark-master:
    build:
      context: ./spark
      dockerfile: Dockerfile
    image: credpipe/spark:3.5.8
    hostname: spark-master
    entrypoint: ["/opt/spark/bin/spark-class"]
    command: ["org.apache.spark.deploy.master.Master", "--host", "spark-master", "--port", "7077", "--webui-port", "8080"]
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    ports:
      - "8080:8080"
      - "7077:7077"
    networks:
      - credpipe-net
    depends_on:
      kafka-init:
        condition: service_healthy
      minio-init:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s

  spark-worker:
    image: credpipe/spark:3.5.8
    hostname: spark-worker
    entrypoint: ["/opt/spark/bin/spark-class"]
    command: ["org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077", "--cores", "2", "--memory", "2g", "--webui-port", "8081"]
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    ports:
      - "8081:8081"
    networks:
      - credpipe-net
    depends_on:
      spark-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s

  generator:
    build:
      context: ../generator
      dockerfile: Dockerfile
    image: credpipe/generator:1.0
    hostname: generator
    environment:
      MONGO_HOST: ${MONGO_HOST:-mongo}
      MONGO_PORT: ${MONGO_PORT:-27017}
      MONGO_REPLICA_SET: ${MONGO_REPLICA_SET:-rs0}
      MONGO_DB: ${MONGO_DB:-creditodb}
      MONGO_COLLECTION: ${MONGO_COLLECTION:-propostas}
      EVENTS_PER_SECOND: ${EVENTS_PER_SECOND:-5.0}
      RATIO_CONSIGNADO: ${RATIO_CONSIGNADO:-0.5}
      RATIO_CARTAO: ${RATIO_CARTAO:-0.3}
      RATIO_FGTS: ${RATIO_FGTS:-0.2}
      RATIO_NEW_VS_TRANSITION: ${RATIO_NEW_VS_TRANSITION:-0.3}
      RATIO_DELETE: ${RATIO_DELETE:-0.02}
      RATIO_CORRECAO: ${RATIO_CORRECAO:-0.05}
      RANDOM_SEED: ${RANDOM_SEED:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    networks:
      - credpipe-net
    depends_on:
      mongo-init:
        condition: service_healthy
    restart: unless-stopped
